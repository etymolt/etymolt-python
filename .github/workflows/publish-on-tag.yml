name: publish-on-tag

# Press-button PyPI publish via Trusted Publishing (OIDC, no API token).
# Triggers on v* tag OR via "Run workflow" UI button.
#
# One-time PyPI setup (operator does this once at pypi.org):
#   1. Log in at https://pypi.org/manage/account/publishing/
#   2. Add a new "pending publisher" with:
#      PyPI Project Name:  etymolt
#      Owner:              etymolt
#      Repository name:    etymolt-python
#      Workflow name:      publish-on-tag.yml
#      Environment name:   pypi
#   3. Save. No tokens needed.
#
# After that, every `git push --tags v*` publishes automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.1). Leave blank for HEAD."
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/etymolt/
    permissions:
      id-token: write   # required for Trusted Publishing OIDC
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine version
        id: version
        run: |
          # Strip leading "v" from tag (e.g. v0.2.1 -> 0.2.1)
          RAW="${{ inputs.tag || github.ref_name }}"
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"
      - name: Wait for PyPI CDN propagation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # PyPI's JSON API propagates faster than the install mirrors.
          # Poll it for up to 5 minutes before attempting pip install.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/etymolt/${VERSION}/json")
            echo "attempt $i: pypi JSON check -> $code"
            if [ "$code" = "200" ]; then
              echo "Version ${VERSION} visible on PyPI JSON API."
              break
            fi
            sleep 10
          done
      - name: Install + smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Retry pip install a few times in case the install mirror hasn't
          # caught up with the JSON API yet.
          set -e
          for i in 1 2 3; do
            echo "pip install attempt $i for etymolt==${VERSION}"
            if pip install --upgrade "etymolt==${VERSION}"; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "pip install failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          python -c "from etymolt import EtymoltClient; print('ok')"
